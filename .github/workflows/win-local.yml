name: Windows (local runner).

# Runs on the self-hosted runner of this machine; push events only, never pull requests.
on:
  push:
    branches:
      - dev
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/win-local.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'
  workflow_dispatch:
    inputs:
      upload:
        description: Upload Telegram.exe as an artifact.
        type: boolean
        default: false
      reconfigure:
        description: Delete the out directory and run CMake from scratch.
        type: boolean
        default: false

# A newer push makes the older run pointless, the stages already built are kept.
concurrency:
  group: windows-local
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  windows:
    name: Windows x64 Debug
    runs-on: [self-hosted, Windows, X64, ivugram]
    timeout-minutes: 600

    env:
      VSROOT: C:\Program Files\Microsoft Visual Studio\18\Community
      # Windows 7 support needs the v143-based toolset, see docs/building-win.md.
      VCVARS_VER: "14.44"
      RECONFIGURE: ${{ inputs.reconfigure }}

    defaults:
      run:
        shell: cmd

    steps:
      # A persistent clone keeps out/ and the submodules, so every build is incremental.
      - name: Sync sources.
        run: |
          set "TBUILD=%USERPROFILE%\TBuild"
          set "SRC=%TBUILD%\ivuGram"
          if not exist "%SRC%\.git" git clone --filter=blob:none --no-checkout "%GITHUB_SERVER_URL%/%GITHUB_REPOSITORY%.git" "%SRC%"
          if errorlevel 1 exit /b 1
          git -C "%SRC%" config core.longpaths true
          git -C "%SRC%" fetch --no-tags --prune origin %GITHUB_SHA%
          if errorlevel 1 exit /b 1
          git -C "%SRC%" checkout --force --detach %GITHUB_SHA%
          if errorlevel 1 exit /b 1
          git -C "%SRC%" submodule sync --recursive
          if errorlevel 1 exit /b 1
          git -C "%SRC%" submodule update --init --recursive --depth 1 --jobs 8
          if errorlevel 1 exit /b 1
          >>"%GITHUB_ENV%" echo TBUILD=%TBUILD%
          >>"%GITHUB_ENV%" echo SRC=%SRC%

      # The prepare step is skipped entirely when nothing it depends on has changed.
      # Python instead of PowerShell: the execution policy of the machine forbids .ps1 files.
      - name: Check libraries.
        run: |
          python -I "%SRC%\.github\scripts\win_local.py" stamp
          if errorlevel 1 exit /b 1

      # The msbuild shim maps the v143 projects of lzma and breakpad to v145 with the 14.44 compiler.
      - name: Libraries.
        if: env.LIBS_CHANGED == 'true'
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvarsall.bat" x64 %SDK% -vcvars_ver=%VCVARS_VER%
          if errorlevel 1 exit /b 1
          set "PATH=%SRC%\.github\scripts\msbuild-v143;%PATH%"
          call "%SRC%\Telegram\build\prepare\win.bat" silent
          if errorlevel 1 exit /b 1
          >"%TBUILD%\.ivugram-libs-stamp" echo %LIBS_STAMP%

      # No debug info keeps the objects small and the linker fast, see CMAKE_MSVC_DEBUG_INFORMATION_FORMAT.
      - name: Configure.
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvarsall.bat" x64 %SDK% -vcvars_ver=%VCVARS_VER%
          if errorlevel 1 exit /b 1
          if "%RECONFIGURE%"=="true" if exist "%SRC%\out" rmdir /s /q "%SRC%\out"
          if exist "%SRC%\out\build.ninja" exit /b 0
          cd /d "%SRC%\Telegram"
          call configure.bat ^
          -G "Ninja Multi-Config" ^
          -D TDESKTOP_API_TEST=ON ^
          -D CMAKE_CONFIGURATION_TYPES=Debug ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          if errorlevel 1 exit /b 1

      - name: Build.
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvarsall.bat" x64 %SDK% -vcvars_ver=%VCVARS_VER%
          if errorlevel 1 exit /b 1
          cmake --build "%SRC%\out" --config Debug --parallel
          if errorlevel 1 exit /b 1

      - name: Summary.
        if: always()
        run: |
          if not defined SRC exit /b 0
          python -I "%SRC%\.github\scripts\win_local.py" summary

      - name: Collect artifact.
        if: success() && inputs.upload
        run: |
          mkdir artifact
          copy /y "%SRC%\out\Debug\Telegram.exe" artifact\
          if errorlevel 1 exit /b 1

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        if: success() && inputs.upload
        with:
          name: Telegram Debug ${{ github.sha }}
          path: artifact\
          retention-days: 3
          compression-level: 1
